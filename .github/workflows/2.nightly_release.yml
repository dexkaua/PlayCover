name: Build nightly release

on:
  workflow_dispatch:
  push:

# A push supersedes any queued/in-progress run of the same branch instead of
# stacking duplicate builds (each one costs ~20 minutes of macOS runner time).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PlayTools/Sparkle are fetched from the GitHub API, which is both slow and
      # rate limited. Restoring Carthage/Build lets the next step skip the fetch.
      - name: Cache Carthage builds
        uses: actions/cache@v4
        with:
          path: Carthage/Build
          key: ${{ runner.os }}-carthage-${{ hashFiles('Cartfile.resolved', 'Cartfile') }}
          restore-keys: |
            ${{ runner.os }}-carthage-

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedData/SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('PlayCover.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      # Build products are restored (never required): Xcode then compiles only
      # what changed instead of the whole project, which is what makes the
      # cold build take ~30 minutes on a 3-core runner.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData/Build
          key: ${{ runner.os }}-dd-${{ hashFiles('PlayCover/**/*.swift', 'PlayCover/**/*.h', 'PlayCover.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-dd-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          # SwiftPM clones packages with plain git. Rewriting the URL through the
          # token authenticates every clone, which removes the anonymous
          # throttling that made package resolution crawl (the repository does
          # not commit a Package.resolved, so xcodebuild resolves on every run).
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

          # xcodebuild resolves packages with libgit2 (not the git CLI), and
          # libgit2 reads credentials from ~/.netrc. Anonymous clones on a shared
          # runner IP are throttled, which is why resolution took 20+ minutes.
          printf 'machine github.com\n  login x-access-token\n  password %s\n' "${GITHUB_TOKEN}" > ~/.netrc
          printf 'machine api.github.com\n  login x-access-token\n  password %s\n' "${GITHUB_TOKEN}" >> ~/.netrc
          chmod 600 ~/.netrc
          echo "~/.netrc written for authenticated package resolution"

          # The "Copy Carthage frameworks" build phase shells out to carthage,
          # so the binary must exist even when the cache is warm.
          if ! command -v carthage >/dev/null 2>&1; then
            brew install carthage
          fi

          if [ -d Carthage/Build/PlayTools.xcframework ]; then
            echo "Carthage cache hit: skipping bootstrap"
          else
            # Carthage resolves PlayTools through the GitHub API. Handing it the
            # token keeps us away from the anonymous 60 requests/hour limit
            # ("API rate limit exceeded" is what killed earlier runs).
            export GITHUB_ACCESS_TOKEN="${GITHUB_TOKEN}"

            # Fast path: only the macOS slice.
            if ! carthage bootstrap --use-xcframeworks --platform macOS; then
              echo "::warning::carthage --platform macOS failed, retrying for all platforms"
              carthage bootstrap --use-xcframeworks || true
            fi

            # PlayTools only exposes iOS slices, so a macOS-only bootstrap never
            # produces it. Force a full update before giving up.
            if [ ! -d Carthage/Build/PlayTools.xcframework ]; then
              echo "::warning::PlayTools.xcframework missing, forcing a full update"
              carthage update --use-xcframeworks || true
            fi

            # Last resort: build PlayTools from a token-authenticated clone so the
            # build never depends on the API budget.
            if [ ! -d Carthage/Build/PlayTools.xcframework ]; then
              echo "::warning::building PlayTools directly from source"
              PT_SRC="$RUNNER_TEMP/PlayTools-src"
              PT_OUT="$RUNNER_TEMP/PlayTools-out"
              rm -rf "$PT_SRC" "$PT_OUT"
              if git clone --depth 1 \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/PlayCover/PlayTools.git" "$PT_SRC"; then
                ( cd "$PT_SRC" && xcodebuild build \
                    -project PlayTools.xcodeproj \
                    -scheme PlayTools \
                    -sdk iphoneos \
                    -arch arm64 \
                    -configuration Release \
                    -derivedDataPath "$RUNNER_TEMP/PlayTools-dd" \
                    CONFIGURATION_BUILD_DIR="$PT_OUT" \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGNING_ALLOWED=NO ) || true
                if [ -d "$PT_OUT/PlayTools.framework" ]; then
                  mkdir -p "$PT_OUT/PlayTools.framework/PlugIns"
                  if [ -d "$PT_OUT/AKInterface.bundle" ]; then
                    cp -R "$PT_OUT/AKInterface.bundle" "$PT_OUT/PlayTools.framework/PlugIns/"
                  fi
                  mkdir -p Carthage/Build
                  rm -rf Carthage/Build/PlayTools.xcframework
                  xcodebuild -create-xcframework \
                    -framework "$PT_OUT/PlayTools.framework" \
                    -output Carthage/Build/PlayTools.xcframework || true
                fi
              fi
            fi
          fi

          if [ -d Carthage/Build/PlayTools.xcframework ]; then
            echo "PlayTools.xcframework is ready"
          else
            echo "::warning::PlayTools.xcframework unavailable - the Xcode phases will skip it"
          fi

          ls -la Carthage/Build 2>/dev/null || true

      # Resolution gets its own, time-boxed step so a stalled GitHub fetch fails
      # here (fast and visible) instead of hiding inside a 30 minute build.
      - name: Resolve Swift packages
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail

          xcodebuild -resolvePackageDependencies \
            -project PlayCover.xcodeproj \
            -scheme PlayCover \
            -derivedDataPath ./DerivedData \
            -clonedSourcePackagesDirPath ./DerivedData/SourcePackages

      - name: Build (arm64)
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail

          xcodebuild build \
            -project PlayCover.xcodeproj \
            -scheme PlayCover \
            -configuration Nightly \
            -arch arm64 \
            -derivedDataPath ./DerivedData \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/output" \
            CODE_SIGN_IDENTITY="-" \
            EXPANDED_CODE_SIGN_IDENTITY="-" \
            EXPANDED_CODE_SIGN_IDENTITY_NAME="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            FASTLANE=1 2>&1 | tee build.log

      - name: Package DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail

          APP="$GITHUB_WORKSPACE/output/PlayCover.app"
          if [ ! -d "$APP" ]; then
            APP="$(find . -name 'PlayCover.app' -type d | head -n 1 || true)"
          fi
          echo "Found app at: $APP"

          if [ ! -d "$APP" ]; then
            echo "::error::PlayCover.app was not produced by the build"
            exit 1
          fi

          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"

          # ZIP ready to use
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/PlayCover_macOS.zip"

          # DMG built with the native hdiutil (no create-dmg, no paid certificate)
          mkdir -p "$GITHUB_WORKSPACE/dmg_stage"
          cp -R "$APP" "$GITHUB_WORKSPACE/dmg_stage/"
          ln -s /Applications "$GITHUB_WORKSPACE/dmg_stage/Applications"
          hdiutil create -volname "PlayCover" -srcfolder "$GITHUB_WORKSPACE/dmg_stage" -ov -format UDZO "$GITHUB_WORKSPACE/PlayCover.dmg"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayCover-nightly
          path: |
            PlayCover.dmg
            PlayCover_macOS.zip
          if-no-files-found: error
