name: Build nightly release
# Fork-friendly nightly build:
# This workflow does NOT require any paid Apple Developer certificates or
# private secrets (APPLE_CERTIFICATE, APPLE_ID, SIGNING_PASSWORD, MATCH_*, ...).
# The app is compiled without code signing and re-signed locally (ad-hoc),
# then uploaded as a GitHub Actions Artifact of the run.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"
env:
  CI: true
  SCHEME: PlayCover
  CONFIGURATION: Nightly
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        shell: bash
        run: |
          brew install swiftlint
          gem install fastlane
          bundle install
          pip install setuptools
          npm install https://github.com/PlayCover/create-dmg

      - name: Set build number
        shell: bash
        run: |
          fastlane run increment_build_number build_number:${{ github.run_number }}

      - name: Update Carthage dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: carthage update --use-xcframeworks

      # Build WITHOUT any paid Apple certificate (no keychain import, no
      # match/cert, no Developer ID identity required) so it works on forks.
      - name: Build (unsigned / ad-hoc, no paid certificate)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_LOG="xcodebuild_build.log"
          xcodebuild build \
            -project PlayCover.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=macOS" \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            EXPANDED_CODE_SIGN_IDENTITY="-" \
            EXPANDED_CODE_SIGN_IDENTITY_NAME="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            FASTLANE=1 \
            2>&1 | tee "$BUILD_LOG"
          # Fail the step if xcodebuild itself failed (tee hides the exit code)
          grep -q "^BUILD SUCCEEDED" "$BUILD_LOG"
          APP="$(find ./DerivedData/Build/Products -maxdepth 2 -name 'PlayCover*.app' -type d -print -quit)"
          test -n "$APP"
          mkdir -p output
          rm -rf output/PlayCover.app
          cp -R "$APP" output/PlayCover.app

      # Ad-hoc sign the built app locally (identity "-" = no certificate needed)
      - name: Ad-hoc codesign PlayCover.app
        shell: bash
        run: |
          codesign --force --deep --sign - ./output/PlayCover.app
          codesign --verify --verbose ./output/PlayCover.app || true

      - name: Create DMG
        shell: bash
        run: |
          npx create-dmg ./output/PlayCover.app ./output
          mv ./output/*.dmg ./output/PlayCover_nightly_${{ github.run_number }}.dmg

      # Ad-hoc sign the DMG as well (harmless on macOS, keeps it self-consistent)
      - name: Ad-hoc codesign DMG
        shell: bash
        run: |
          codesign --force --deep --sign - ./output/PlayCover_nightly_${{ github.run_number }}.dmg || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayCover_nightly_${{ github.run_number }}.dmg
          path: output/PlayCover_nightly_${{ github.run_number }}.dmg
          if-no-files-found: error

      # Fallback: also upload the zipped .app in case DMG creation fails
      - name: Zip app and upload as fallback artifact
        shell: bash
        run: |
          cd output
          ditto -c -k --keepParent PlayCover.app PlayCover_nightly_${{ github.run_number }}.app.zip
      - name: Upload App Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlayCover_nightly_${{ github.run_number }}.app.zip
          path: output/PlayCover_nightly_${{ github.run_number }}.app.zip
          if-no-files-found: ignore

  # Disabled: uploading to the official repo / GitHub Release requires
  # permissions/secrets that personal forks don't have.
