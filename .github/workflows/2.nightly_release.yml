name: Build nightly release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

env:
  CI: true

jobs:
  build:
    runs-on: macos-14
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          brew install carthage || true
          brew upgrade carthage || true

      - name: Carthage Bootstrap
        shell: bash
        run: carthage bootstrap --use-xcframeworks --platform macOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (arm64 only)
        shell: bash
        run: |
          xcodebuild build \
            -project PlayCover.xcodeproj \
            -scheme PlayCover \
            -configuration Nightly \
            -arch arm64 \
            -derivedDataPath ./DerivedData \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/output" \
            CODE_SIGN_IDENTITY="-" \
            EXPANDED_CODE_SIGN_IDENTITY="-" \
            EXPANDED_CODE_SIGN_IDENTITY_NAME="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            FASTLANE=1

      - name: Package (zip + dmg via hdiutil, no create-dmg)
        shell: bash
        run: |
          APP="$GITHUB_WORKSPACE/output/PlayCover.app"
          if [ ! -d "$APP" ]; then
            APP="$(find . -name 'PlayCover.app' -type d | head -n 1)"
          fi
          echo "Found app at: $APP"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"

          # Criar ZIP pronto para uso
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/PlayCover_macOS.zip"

          # Criar DMG usando hdiutil nativo (sem create-dmg para não exigir certificado Apple)
          mkdir -p "$GITHUB_WORKSPACE/dmg_stage"
          cp -R "$APP" "$GITHUB_WORKSPACE/dmg_stage/"
          ln -sf /Applications "$GITHUB_WORKSPACE/dmg_stage/Applications"
          hdiutil create -volname "PlayCover" -srcfolder "$GITHUB_WORKSPACE/dmg_stage" -ov -format UDZO "$GITHUB_WORKSPACE/PlayCover.dmg"

      - name: Upload Artifact (dmg)
        uses: actions/upload-artifact@v4
        with:
          name: PlayCover_nightly_${{ github.run_number }}.dmg
          path: PlayCover.dmg

      - name: Upload Artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: PlayCover_nightly_${{ github.run_number }}.zip
          path: PlayCover_macOS.zip
